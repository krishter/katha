<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katha — Wireframes for Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
<style>
/* Palette matches the Katha brand established on coming-soon/index.html and
   now tokenised in frontend/app/globals.css. Saffron is a FILL colour only —
   text on saffron is indigo (5.77:1); accent text uses saffron-ink. */
:root{
  --bg:#EFE7DA; --panel:#FFF; --line:#E3D5C2; --line-2:#EFE6D9;
  --ink:#17182D; --mut:#454B69; --mut-2:#646983;
  --terra:#F77F00; --terra-d:#B84500; --parch:#F2EADD; --surface:#F9F4EE;
  --indigo:#211A61; --indigo-mid:#30358B; --indigo-soft:#CDD6F9;
  --gold:#D48500; --gold-ink:#A25700;
  --ok:#007B40; --att:#A25700; --side:#211A61;
  --wire:#E3D5C2; --wire-2:#F2EADD;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.55 'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3.wh,.hero h3,.disp{font-family:'Playfair Display',Georgia,serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- app chrome ---------- */
.app{display:flex;min-height:100vh}
.side{width:284px;flex:none;background:var(--side);color:#E4E7FA;padding:22px 0 60px;overflow-y:auto;height:100vh;position:sticky;top:0}
.side h1{font-size:19px;font-weight:600;padding:0 20px;letter-spacing:.2px}
.side .sub{padding:2px 20px 16px;font-size:12px;color:#A9B0E0;line-height:1.5}
.grp{padding:16px 20px 5px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#9AA2D8;font-weight:600}
.nav{display:block;width:100%;text-align:left;padding:7px 20px;font-size:13.5px;color:#C3C9EE;display:flex;gap:8px;align-items:center;line-height:1.35}
.nav:hover{background:#30358B;color:#fff}
.nav.on{background:var(--terra-d);color:#fff}
.nav .id{font-size:10.5px;font-weight:700;opacity:.75;width:20px;flex:none}
.nav .p{margin-left:auto;font-size:9px;font-weight:700;padding:1.5px 4px;border-radius:3px;flex:none}
.p0{background:#8C2F1F;color:#FFDCD2}.p1{background:#6B4A12;color:#FAE3B8}.p2{background:#3A3F7A;color:#C3C9EE}
.nav.on .p{background:rgba(0,0,0,.3);color:#fff}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:30px 38px 90px;max-width:1500px}
.hd{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.hd .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd .kid{font-size:12px;font-weight:700;color:var(--mut-2);letter-spacing:.06em}
.hd h2{font-size:26px;font-weight:600;letter-spacing:-.2px}
.tag{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:4px;letter-spacing:.04em}
.t0{background:#FADFD6;color:#8C2F1F}.t1{background:#FAEBCF;color:#6B4A12}.t2{background:#E4E6F2;color:#3A3F7A}
.tn{background:#C3F2D7;color:#005E31}.tr{background:#CDD6F9;color:#211A61}
.hd p{margin-top:9px;color:var(--mut);max-width:78ch;font-size:14.5px}

.views{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.view{}
.vlab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut-2);font-weight:700;margin-bottom:9px}

/* device frames */
.phone{width:340px;border:9px solid #211A61;border-radius:28px;background:var(--parch);overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.13)}
.phone .scr{height:660px;overflow-y:auto}
.desk{width:820px;border:1px solid var(--line);border-top:22px solid #211A61;border-radius:9px;background:var(--parch);overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.1)}
.desk .scr{height:648px;overflow-y:auto}
.na{width:340px;border:1px dashed var(--line);border-radius:10px;padding:26px 18px;color:var(--mut-2);font-size:13px;text-align:center;background:#F9F4EE}

/* ---------- wireframe primitives ---------- */
.w{padding:14px}
.w.p0pad{padding:0}
.nb{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line-2)}
.nb b{font-size:14px}
.nb .lk{font-size:11.5px;color:var(--mut);display:flex;gap:11px}
.tabs{display:flex;border-top:1px solid var(--line-2);background:#fff;position:sticky;bottom:0}
.tabs div{flex:1;text-align:center;padding:9px 2px 10px;font-size:10px;color:var(--mut-2)}
.tabs div.on{color:var(--terra-d);font-weight:700}
.tabs .ic{display:block;width:17px;height:17px;border:1.5px solid currentColor;border-radius:4px;margin:0 auto 3px}

h3.wh{font-size:17px;font-weight:600;margin:0 0 3px}
h4.wh{font-size:13.5px;font-weight:600;margin:16px 0 7px}
.sm{font-size:11.5px;color:var(--mut)}
.xs{font-size:10.5px;color:var(--mut-2)}
.ph{height:8px;background:var(--wire);border-radius:4px;margin:6px 0}
.ph.s{width:55%}.ph.m{width:78%}.ph.l{width:96%}.ph.t{height:6px}
.card{background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:12px;margin-bottom:10px}
.card.acc{border-left:3px solid var(--terra)}
.card.ok{border-left:3px solid var(--ok)}
.card.att{border-left:3px solid var(--att)}
.btn{display:block;text-align:center;background:var(--terra);color:var(--indigo);border-radius:8px;padding:10px;font-size:13px;font-weight:600;margin:10px 0}
.btn.g{background:#fff;color:var(--terra-d);border:1px solid var(--terra)}
.btn.n{background:#fff;color:var(--mut);border:1px solid var(--line)}
.btn.d{background:#fff;color:#BA3D5B;border:1px solid #EFC9D0}
.btn.sm{padding:7px;font-size:11.5px;margin:7px 0}
.inp{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--mut-2);background:#fff;margin:5px 0 11px}
.lb{font-size:11.5px;font-weight:600;margin-top:9px;display:block}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:10.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mut)}
.chip.on{background:var(--terra);color:var(--indigo);border-color:var(--terra)}
.grid{display:grid;gap:9px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.tile{background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:11px;text-align:center}
.tile b{font-size:19px;display:block;font-weight:600}
.tile span{font-size:10px;color:var(--mut)}
.img{background:var(--wire-2);border:1px solid var(--line-2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut-2);font-size:10.5px;text-align:center;padding:8px}
.bar{height:6px;background:var(--wire);border-radius:99px;overflow:hidden;margin:4px 0 9px}
.bar i{display:block;height:100%;background:var(--terra);border-radius:99px}
.q{border-left:3px solid var(--terra);padding-left:10px;font-style:italic;font-size:12.5px;color:#30358B;margin:9px 0;line-height:1.6}
.aud{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;margin:9px 0}
.aud .pl{width:27px;height:27px;border-radius:99px;background:var(--terra);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.aud .wv{flex:1;height:20px;background:repeating-linear-gradient(90deg,var(--wire) 0 2px,transparent 2px 5px)}
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--parch);color:var(--mut);border:1px solid var(--line-2)}
.badge.ok{background:#E4F0E7;color:#2E5438;border-color:#C4DDCB}
.badge.att{background:#F8E7DF;color:#8C4A28;border-color:#EBCDBE}
.tbl{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.tbl th{text-align:left;padding:8px 9px;background:#F2EADD;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line-2)}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--line-2);color:var(--ink)}
.tbl tr:last-child td{border-bottom:none}
.hero{background:linear-gradient(160deg,#211A61,#30358B);color:#EDEFFB;padding:26px 18px;border-radius:0}
.hero h3{color:#fff;font-size:21px;line-height:1.25;font-weight:600}
.hero p{font-size:12px;color:#BFC6EE;margin-top:9px;line-height:1.6}

/* whatsapp */
.wa{background:#ECE4DB;padding:12px;min-height:100%}
.wahd{background:#075E54;color:#fff;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;margin:-12px -12px 12px}
.wahd .av{width:26px;height:26px;border-radius:99px;background:linear-gradient(135deg,var(--terra),var(--gold));flex:none}
.bub{background:#fff;border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:9px;max-width:84%;line-height:1.55;box-shadow:0 1px 1px rgba(0,0,0,.07)}
.bub.me{background:#DCF8C6;margin-left:auto}
.bub .t{font-size:9px;color:#95A0A5;text-align:right;margin-top:3px}
.vn{display:flex;align-items:center;gap:8px}
.vn .pl{width:24px;height:24px;border-radius:99px;background:#075E54;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;flex:none}
.vn .wv{flex:1;height:16px;background:repeating-linear-gradient(90deg,#B9C4C9 0 2px,transparent 2px 5px)}

/* annotations */
.ann{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.ann h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;font-weight:700}
.ann ol{list-style:none;counter-reset:a;display:grid;gap:11px;max-width:104ch}
.ann li{counter-increment:a;position:relative;padding-left:34px;font-size:14px;color:#30358B;line-height:1.6}
.ann li::before{content:counter(a);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:99px;background:var(--terra-d);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ann li b{font-weight:600}
.ann li code{background:#E8E0D2;padding:1px 5px;border-radius:4px;font-size:12.5px}
.crit{background:#FCF1EC;border:1px solid #F0D3C2;border-radius:9px;padding:13px 15px;margin-top:20px;font-size:14px;color:#8C2F1F;max-width:104ch;line-height:1.6}
.crit b{font-weight:700}
.api{background:#EEF1FC;border:1px solid #CDD6F9;border-radius:9px;padding:13px 15px;margin-top:14px;font-size:13.5px;color:#211A61;max-width:104ch;line-height:1.6}
.api code{background:#DCE3FA;padding:1px 5px;border-radius:4px;font-size:12.5px}
@media(max-width:1100px){.side{display:none}.main{padding:20px}}
</style>
</head>

"<b>This screen is the fix for F-02, the most serious finding in the review.</b> Under the DPDP Act the parent is the data principal. A competent adult cannot have consent given on his behalf by his daughter. No session may initiate until this exchange completes.",
"<b>Name the daughter in the first sentence.</b> 'Your daughter Priya asked me to write to you' converts an unexplained message from an unknown number into something legitimate. Without it the most likely outcome is a block.",

const GROUPS = ["Acquisition","Onboarding","Family portal","Account & control","Lifecycle states","WhatsApp (parent)","Ops console"];
const PTAG = {P0:"t0",P1:"t1",P2:"t2"};
const PCLS = {P0:"p0",P1:"p1",P2:"p2"};

function buildNav(){
  const n = document.getElementById('nav');
  GROUPS.forEach(g=>{
    const items = SCREENS.filter(s=>s.group===g);
    if(!items.length) return;
    const h=document.createElement('div'); h.className='grp'; h.textContent=g; n.appendChild(h);
    items.forEach(s=>{
      const b=document.createElement('button');
      b.className='nav'; b.dataset.id=s.id;
      b.innerHTML=`<span class="id">${s.id}</span><span>${s.title}</span><span class="p ${PCLS[s.prio]}">${s.prio}</span>`;
      b.onclick=()=>show(s.id);
      n.appendChild(b);
    });
  });
}

function show(id){
  const s = SCREENS.find(x=>x.id===id); if(!s) return;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  const statusTag = s.status==='New' ? '<span class="tag tn">NEW</span>'
                  : s.status==='Rebuild' ? '<span class="tag tr">REBUILD</span>'
                  : s.status ? '<span class="tag t2">REVISE</span>' : '';
  const mobile = s.m ? `<div class="view"><div class="vlab">Mobile · 375px</div><div class="phone"><div class="scr">${s.m}</div></div></div>` : '';
  const desk = s.d ? `<div class="view"><div class="vlab">Desktop · 1280px</div><div class="desk"><div class="scr">${s.d}</div></div></div>`
                   : (s.m ? `<div class="view"><div class="vlab">Desktop</div><div class="na">Mobile-only screen.<br>Desktop uses the same layout at a wider measure.</div></div>` : '');
  document.getElementById('main').innerHTML = `
    <div class="hd">
      <div class="row"><span class="kid">${s.id}</span><h2>${s.title}</h2>
        <span class="tag ${PTAG[s.prio]}">${s.prio}</span>${statusTag}</div>
      <p>${s.purpose}</p>
    </div>
    <div class="views">${mobile}${desk}</div>
    ${s.crit?`<div class="crit">${s.crit}</div>`:''}
    ${s.api?`<div class="api"><b>Backend:</b> ${s.api}</div>`:''}
    <div class="ann"><h3>Design notes &amp; acceptance criteria</h3><ol>${s.notes.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const cur=document.querySelector('.nav.on'); if(!cur)return;
  const all=[...document.querySelectorAll('.nav')];
  const i=all.indexOf(cur)+(e.key==='ArrowDown'?1:-1);
  if(all[i]){all[i].click();all[i].scrollIntoView({block:'nearest'});e.preventDefault();}
});
