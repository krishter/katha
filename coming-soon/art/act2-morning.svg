<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" class="scene" role="img" aria-label="An elderly woman in a saffron saree sits in an armchair by a sunlit arched window; she leans towards the phone on the table beside her and starts talking">
  <defs><clipPath id="s5-cut"><path d="M60 120 C 120 20, 420 10, 560 90 C 640 140, 630 420, 560 500 C 470 590, 140 600, 70 500 C 10 420, 10 200, 60 120Z"/></clipPath></defs>
  <g clip-path="url(#s5-cut)">
  <rect width="640" height="600" fill="#F6DCD8"/>

  <!-- arched window, morning sun -->
  <g filter="url(#pc-shadow)"><path d="M360 330 V160 A90 90 0 0 1 540 160 V330 Z" fill="#FBF4E6"/></g>
  <circle cx="450" cy="175" r="44" fill="#F2C14E"/>
  <path d="M450 72 V330 M360 232 H540" stroke="#E5DAC6" stroke-width="7"/>
  <path d="M360 330 V160 A90 90 0 0 1 540 160 V330 Z" fill="none" stroke="#E5DAC6" stroke-width="7"/>

  <!-- floor -->
  <g filter="url(#pc-shadow)"><path d="M0 470 C 160 450, 420 455, 640 475 V600 H0Z" fill="#E9D9BC"/></g>

  <!-- armchair -->
  <g filter="url(#pc-shadow)"><rect x="110" y="205" width="210" height="260" rx="70" fill="#2F2A73"/></g>
  <rect x="112" y="458" width="12" height="30" rx="4" fill="#1E1A4A"/>
  <rect x="318" y="458" width="12" height="30" rx="4" fill="#1E1A4A"/>
  <g filter="url(#pc-shadow)"><rect x="95" y="385" width="250" height="78" rx="26" fill="#3A3488"/></g>

  <!-- her -->
  <use href="#her-seated" x="136" y="196" width="232" height="280"/>

  <!-- side table -->
  <rect x="424" y="398" width="12" height="78" fill="#8E5530"/>
  <ellipse cx="430" cy="478" rx="40" ry="8" fill="#8E5530"/>
  <g filter="url(#pc-shadow)"><ellipse cx="430" cy="396" rx="74" ry="14" fill="#B5703E"/></g>

  <!-- steel tumbler -->
  <path d="M458 340 L 490 340 L 486 392 L 462 392 Z" fill="#D5D8E0"/>
  <ellipse cx="474" cy="340" rx="16" ry="4" fill="#ECEEF3"/>
  <rect x="465" y="346" width="5" height="40" fill="#FFFFFF" opacity="0.7"/>

  <!-- her voice, towards the phone: she starts the conversation -->
  <g fill="none" stroke="#E8822F" stroke-width="3" stroke-linecap="round">
    <path d="M272 226 Q 282 240 272 254" opacity="0.8"/>
    <path d="M284 216 Q 300 240 284 264" opacity="0.5"/>
    <path d="M296 206 Q 318 240 296 274" opacity="0.25"/>
  </g>
  <g filter="url(#pc-shadow)"><rect x="398" y="314" width="42" height="76" rx="8" fill="#241D5C"/></g>
  <rect x="402" y="320" width="34" height="64" rx="5" fill="#FFF3DE"/>
  <!-- the mic, held -->
  <circle cx="419" cy="368" r="10" fill="#2FA36B"/>
  <rect x="416" y="361" width="6" height="10" rx="3" fill="#FFFFFF"/>
  <path d="M413.5 368 a5.5 5.5 0 0 0 11 0 M419 373.5 V376" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#241D5C">
    <rect x="410" y="334" width="2" height="6" rx="1"/><rect x="414" y="331" width="2" height="12" rx="1"/>
    <rect x="418" y="329" width="2" height="16" rx="1"/><rect x="422" y="332" width="2" height="10" rx="1"/>
    <rect x="426" y="334" width="2" height="6" rx="1"/>
  </g>

  <rect width="640" height="600" filter="url(#pc-grain)"/>
  </g>
</svg>
