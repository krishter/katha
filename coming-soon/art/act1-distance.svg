<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" class="scene" role="img" aria-label="Two clocks showing different times, and between them a phone with the call ended">
  <!-- distance between two clocks -->
  <path d="M248 212 C 300 120, 340 120, 392 212" fill="none" stroke="#F6E7C8" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>

  <!-- your clock: Sunday evening -->
  <g fill="none" stroke="#F6E7C8" stroke-width="3" stroke-linecap="round">
    <circle cx="170" cy="220" r="70"/>
    <path d="M170 156 V164 M234 220 H226 M170 284 V276 M106 220 H114"/>
    <path d="M170 220 L 138.8 238"/>
    <path id="d-min-a" d="M170 220 L 170 168"/>
  </g>
  <circle cx="170" cy="220" r="4" fill="#F6E7C8"/>

  <!-- her clock: another time zone -->
  <g fill="none" stroke="#F2C14E" stroke-width="3" stroke-linecap="round">
    <circle cx="470" cy="220" r="70"/>
    <path d="M470 156 V164 M534 220 H526 M470 284 V276 M406 220 H414"/>
    <path d="M470 220 L 444.5 194.5"/>
    <path id="d-min-b" d="M470 220 L 470 272"/>
  </g>
  <circle cx="470" cy="220" r="4" fill="#F2C14E"/>

  <!-- the phone, call ended -->
  <g fill="none" stroke="#F2C14E" stroke-width="2">
    <circle cx="320" cy="440" r="118" opacity="0.18"/>
    <circle cx="320" cy="440" r="160" opacity="0.09"/>
  </g>
  <rect x="262" y="330" width="116" height="214" rx="22" fill="#FBF4E6"/>
  <rect x="273" y="343" width="94" height="188" rx="13" fill="#F3EDE1"/>
  <circle cx="320" cy="392" r="20" fill="none" stroke="#241D5C" stroke-width="2.5" opacity="0.55"/>
  <rect x="294" y="424" width="52" height="5" rx="2.5" fill="#241D5C" opacity="0.45"/>
  <rect x="304" y="436" width="32" height="4" rx="2" fill="#241D5C" opacity="0.25"/>
  <g class="call-end">
    <circle cx="320" cy="494" r="19" fill="#D0566E"/>
    <path d="M308 497 C 308 488, 332 488, 332 497 L 327 499 L 325 494 C 322 492, 318 492, 315 494 L 313 499 Z" fill="#FBF4E6"/>
  </g>

  <!-- a steel tumbler left on the side -->
  <path d="M520 466 L 556 466 L 551 526 L 525 526 Z" fill="#C9CCD8"/>
  <ellipse cx="538" cy="466" rx="18" ry="4.5" fill="#E6E8EF"/>
  <rect x="528" y="473" width="5" height="46" fill="#FFFFFF" opacity="0.6"/>
</svg>
