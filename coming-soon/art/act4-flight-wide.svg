  <use href="#vignette-child" x="640" y="0" width="640" height="600"/>
  <path id="fw-path" d="M419 312 C 520 30, 830 30, 917 330" fill="none" stroke="#E8822F" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 11"/>
  <g id="fw-env" transform="translate(968 386)"><use href="#mini-envelope" width="64" height="44"/></g>
  <g id="fw-card" transform="translate(877 280)"><use href="#mini-card" width="80" height="100"/></g>
</svg>
