[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "katha-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The eval harness builds long human-readable evidence strings that get
# pasted into PR bodies and read by eye. Wrapping them at 88 columns makes
# the source harder to read without making the output any better.
"evals/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "opener_off: run a scheduler test with SCHEDULED_OPENER_ENABLED=false, the default (see tests/test_session_initiator.py).",
    "real_s3_client: build a real boto3 S3 client (with dummy credentials, no network) instead of the refusal every other test gets (see backend/conftest.py).",
    "real_ledger: write usage-ledger rows to the real database instead of the in-memory capture every other test gets (see backend/conftest.py).",
    "real_twilio_queue: write core/twilio_cleanup's deletion queue to the real database instead of the in-memory capture every other test gets (see backend/conftest.py).",
    "real_media_tracking: record uploaded S3 keys in the real media_objects table instead of the in-memory capture every other test gets (see backend/conftest.py).",
    "integration: requires a real Postgres (pgvector) connection — skips itself if DATABASE_URL isn't reachable rather than failing CI, which has no DB service. Run against `docker compose up db` for real verification (see REMEDIATION_PLAN WS5).",
]
