name: CI

on:
  push:
  pull_request:

jobs:
  # The repository is public: a credential committed here is published.
  # See scripts/secret_scan.sh for what it looks for.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on credential-shaped strings in tracked files
        run: ./scripts/secret_scan.sh

  backend-test:
    name: Backend lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # tests/integration/ skips itself when no Postgres is reachable, which
    # was CI's permanent state — so the deletion E2E, failure-injection,
    # pilot-rehearsal and parent-consent suites, the four that exercise
    # what Sprint 1 actually fixed, had never run in CI (S4.0c). pgvector
    # rather than stock postgres: migrations create the vector extension
    # and story_atoms.embedding, retained unwritten for Phase 2.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katha
          POSTGRES_PASSWORD: katha
          POSTGRES_DB: katha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://katha:katha@localhost:5432/katha
      # Turns the integration suite's self-skip into a hard failure. Without
      # it a broken service container reports green, which is the failure
      # mode this whole block exists to remove.
      KATHA_REQUIRE_DB: "1"
      # config.Settings declares these with no default, so importing config
      # raises without them. backend/conftest.py sets them for pytest, but
      # `alembic upgrade head` does not load conftest — so the migration
      # step needs them here. Deliberately fake: nothing in CI calls a paid
      # API, and a real key in a workflow file would be a leak.
      SARVAM_API_KEY: ci-not-a-real-key
      ANTHROPIC_API_KEY: ci-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The production image installs ffmpeg (backend/Dockerfile), and the
      # audio paths shell out to it. Installing it here lets the tests run
      # the real binary instead of a mock of it — media/audio_split.py
      # exists because Sarvam rejects audio over 30s, which no mocked
      # subprocess could ever have told us.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # libraqm is what shapes Indic text (HarfBuzz + FriBidi). Pillow
      # links it at BUILD time, so the wheel on PyPI does not have it and
      # installing the library alone changes nothing — hence --no-binary
      # below, matching backend/Dockerfile. Without this the memory-card
      # shaping tests skip, and a card that renders Malayalam as tofu
      # boxes would pass CI green.
      - name: Install libraqm (Pillow complex text layout)
        run: >
          sudo apt-get install -y -qq
          libraqm-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev
          libjpeg-dev zlib1g-dev

      - name: Install dependencies
        run: pip install --no-binary Pillow -r requirements.txt

      # A skipped shaping test is indistinguishable from a passing one in
      # the summary line, and the whole failure being fixed here was
      # invisible-by-default. Fail the job instead.
      - name: Verify Pillow has libraqm
        run: >
          python -c "from PIL import features;
          assert features.check('raqm'),
          'Pillow built without libraqm — the card shaping tests would skip'"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest tests/ -v

  frontend-lint:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
